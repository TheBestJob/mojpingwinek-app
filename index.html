</style></head><body><div class="phone"><div class="hero"><div class="hero-top"><div class="brand"><div class="brand-icon">🐧</div><div><strong>Mój Pingwinek</strong><span>Twoje miejsce wsparcia</span></div></div><button class="round" onclick="go('notifications')" aria-label="Powiadomienia">🔔</button></div><h1 id="hero-title">Dzień dobry! 👋</h1><p id="hero-sub">Małe kroki. Wielkie możliwości.</p></div><main class="content" id="app"></main><nav class="bottom" id="bottom"></nav></div><script>
'use strict';const KEY='mojpingwinek_demo3';const initial={notes:[],events:[],notifications:true};let data;try{data={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data={...initial}};let view='home',category='Wszystkie',selectedDate=new Date().toISOString().slice(0,10),month=new Date().getMonth(),year=new Date().getFullYear(),detail='';const demoDocs=[{name:'Orzeczenie o niepełnosprawności',group:'Orzeczenia',date:'12.09.2026',icon:'📋',status:'Aktualny'},{name:'Zalecenia do terapii',group:'Zalecenia',date:'05.10.2026',icon:'📝',status:'Ważne'},{name:'Zaświadczenie lekarskie',group:'Zaświadczenia',date:'18.09.2026',icon:'📄',status:'Do wglądu'},{name:'Opinia psychologiczna',group:'Opinie',date:'23.09.2026',icon:'🧠',status:'Archiwum'}];const tabs=[['home','Pulpit','⌂'],['docs','Dokumenty','▤'],['calendar','Kalendarz','▦'],['journal','Dziennik','✎'],['more','Więcej','☰']];const titles={home:'Dzień dobry! 👋',docs:'Dokumenty',calendar:'Kalendarz',journal:'Dziennik obserwacji',more:'Więcej możliwości',passport:'Paszport medyczny',specialists:'Specjaliści',support:'Wsparcie dla rodzica',notifications:'Powiadomienia',formalities:'Poradnik formalności',school:'Specjaliści w szkole',community:'Społeczność',settings:'Ustawienia demo',addnote:'Nowa obserwacja',addevent:'Dodaj wydarzenie',document:'Szczegóły dokumentu',medical:'Dokumentacja medyczna',contacts:'Ważne kontakty',deadlines:'Terminy i formalności'};const $=s=>document.querySelector(s);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(s){const old=$('.toast');if(old)old.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}function go(p){view=p;render();window.scrollTo(0,0)}function heading(p){return '<div class="page-head"><button class="back" onclick="go(\'home\')">← Wróć</button><h2>'+esc(titles[p]||p)+'</h2></div>'}function card(icon,title,subtitle,action){return '<div class="card"><button class="item" onclick="'+action+'"><div class="card-row"><span class="card-icon">'+icon+'</span><span class="card-meta"><strong>'+esc(title)+'</strong><small>'+esc(subtitle)+'</small></span><span class="chev">›</span></div></button></div>'}function tile(icon,title,subtitle,page,cl){return '<button class="tile '+(cl||'')+'" onclick="go(\''+page+'\')"><em>'+icon+'</em><strong>'+title+'</strong><small>'+subtitle+'</small></button>'}function section(title,right){return '<div class="section"><h2>'+title+'</h2>'+(right||'')+'</div>'}function aviso(){return '<div class="notice">🔒 Wersja demonstracyjna. Używaj wyłącznie fikcyjnych danych. Wpisy zapisują się lokalnie i nie są szyfrowaną dokumentacją medyczną.</div>'}function makeCalendar(){let first=new Date(year,month,1).getDay();first=(first+6)%7;let total=new Date(year,month+1,0).getDate();let out='<div class="month"><button class="secondary" onclick="shift(-1)">‹</button><strong>'+new Date(year,month,1).toLocaleDateString('pl-PL',{month:'long',year:'numeric'})+'</strong><button class="secondary" onclick="shift(1)">›</button></div><div class="calendar">'+['Pn','Wt','Śr','Cz','Pt','Sb','Nd'].map(d=>'<span class="weekday">'+d+'</span>').join('');for(let i=0;i<first;i++)out+='<span></span>';for(let i=1;i<=total;i++){let val=year+'-'+String(month+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');let marked=data.events.some(x=>x.date===val);out+='<button class="date '+(val===selectedDate?'selected ':'')+(val===new Date().toISOString().slice(0,10)?'current ':'')+(marked?'marked':'')+'" onclick="datePick(\''+val+'\')">'+i+'</button>'}return out+'</div>'}function shift(v){month+=v;if(month<0){month=11;year--}if(month>11){month=0;year++}render()}function datePick(d){selectedDate=d;render()}function openDoc(i){detail=String(i);go('document')}function resetDemo(){if(confirm('Usunąć wpisy demonstracyjne z tego urządzenia?')){data={...initial};persist();go('home');toast('Dane demo wyczyszczone')}}function addNote(e){e.preventDefault();let title=$('#note-title').value.trim(),body=$('#note-body').value.trim();if(!title||!body)return;data.notes.unshift({title,body,date:new Date().toISOString().slice(0,10)});persist();go('journal');toast('Zapisano przykładową obserwację')}function addEvent(e){e.preventDefault();let title=$('#ev-title').value.trim(),date=$('#ev-date').value;if(!title||!date)return;data.events.push({title,date});persist();selectedDate=date;month=Number(date.slice(5,7))-1;year=Number(date.slice(0,4));go('calendar');toast('Dodano wydarzenie demonstracyjne')}function removeNote(i){data.notes.splice(i,1);persist();render()}function removeEvent(i){data.events.splice(i,1);persist();render()}function pickCat(s){category=s;render()}function demoOnly(){toast('Ta funkcja będzie dostępna w pełnej aplikacji')}function render(){let out='';$('#hero-title').textContent=titles[view]||'Mój Pingwinek';$('#hero-sub').textContent=view==='home'?'Małe kroki. Wielkie możliwości.':'Mój Pingwinek · interaktywny prototyp 3.0';if(view==='home'){out='<div class="profile"><div class="avatar">🐧</div><div><strong>Profil dziecka: Pingwinek</strong><p>Przykładowy profil • konto demonstracyjne</p><span class="tag">Tryb demo</span></div></div>'+section('Twoja przestrzeń','<button class="link" onclick="go(\'more\')">Zobacz więcej →</button>')+'<div class="tiles">'+tile('📁','Dokumenty','Orzeczenia i zaświadczenia','docs')+tile('📅','Kalendarz','Terminy i przypomnienia','calendar','green')+tile('🌱','Dziennik','Postępy i obserwacje','journal','orange')+tile('🩺','Paszport medyczny','Ważne informacje','passport','lilac')+tile('👩‍⚕️','Specjaliści','Twój zespół wsparcia','specialists','green')+tile('💚','Wsparcie rodzica','Pomoc na co dzień','support')+'</div>'+section('Najbliższe terminy')+(data.events.length?data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2).map(e=>card('📅',e.title,e.date,"go('calendar')")).join(''):card('🗓️','Dodaj pierwsze wydarzenie','Wizyta, terapia lub ważny termin',"go('addevent')"))+section('Ważne sprawy')+card('📋','Poradnik formalności','Terminy, orzeczenia, przydatne informacje',"go('formalities')")+aviso()}
else if(view==='docs'){out=heading(view)+'<p class="sub">Wszystkie ważne dokumenty w jednym miejscu. Poniższe pozycje są przykładowe.</p><input class="input" aria-label="Szukaj dokumentów" placeholder="🔎 Szukaj dokumentu" id="search-doc" oninput="filterDocs()"><div class="section"><h2>Moje dokumenty</h2><span class="tag">'+demoDocs.length+' pliki demo</span></div><div class="tabs">'+['Wszystkie','Orzeczenia','Zalecenia','Zaświadczenia','Opinie'].map(x=>'<button class="chip '+(category===x?'active':'')+'" onclick="pickCat(\''+x+'\')">'+x+'</button>').join('')+'</div><div id="docs-list"></div><button class="primary full" onclick="demoOnly()">＋ Prześlij dokument</button>'+aviso()}
else if(view==='document'){let d=demoDocs[Number(detail)]||demoDocs[0];out=heading(view)+'<div class="card" style="text-align:center;padding:28px"><div style="font-size:55px">'+d.icon+'</div><h2>'+esc(d.name)+'</h2><p class="sub">Przykładowa pozycja · '+d.date+'</p><span class="tag">'+d.status+'</span></div><div class="card"><strong>Rodzaj</strong><p>'+d.group+'</p><strong>Status</strong><p>'+d.status+'</p></div><button class="secondary full" onclick="demoOnly()">Podgląd pliku (wkrótce)</button>'+aviso()}
else if(view==='calendar'){out=heading(view)+'<p class="sub">Planuj spotkania, wizyty i terapię. Dodane terminy pozostają na tym urządzeniu.</p><div class="card">'+makeCalendar()+'</div>'+section('Wydarzenia · '+selectedDate)+(()=>{let filtered=data.events.map((e,i)=>({...e,i})).filter(e=>e.date===selectedDate);return filtered.length?filtered.map(e=>'<div class="card"><div class="card-row"><span class="card-icon">📅</span><div class="card-meta"><strong>'+esc(e.title)+'</strong><small>'+e.date+'</small></div><button class="link" onclick="removeEvent('+e.i+')">Usuń</button></div></div>').join(''):'<div class="empty">Nie masz wydarzeń tego dnia.</div>'})()+'<button class="primary full" onclick="go(\'addevent\')">＋ Dodaj wydarzenie</button>'+aviso()}
else if(view==='addevent'){out=heading(view)+'<form class="card" onsubmit="addEvent(event)"><label class="field" for="ev-title">Nazwa wydarzenia</label><input required maxlength="90" class="input" id="ev-title" placeholder="np. wizyta u logopedy"><label class="field" for="ev-date">Data</label><input required type="date" class="input" id="ev-date" value="'+esc(selectedDate)+'"><p></p><button type="submit" class="primary full">Zapisz wydarzenie</button></form>'+aviso()}
else if(view==='journal'){out=heading(view)+'<p class="sub">Zapisuj małe sukcesy, nowe umiejętności i ważne momenty.</p><div class="stat-grid"><div class="stat"><strong>'+data.notes.length+'</strong><small>Wpisy w demo</small></div><div class="stat"><strong>🌱</strong><small>Każdy krok ma znaczenie</small></div></div>'+section('Moje obserwacje')+(data.notes.length?data.notes.map((n,i)=>'<div class="card"><strong>'+esc(n.title)+'</strong><p class="sub">'+esc(n.body)+'</p><small>'+esc(n.date)+'</small><button class="link" style="float:right" onclick="removeNote('+i+')">Usuń</button></div>').join(''):'<div class="card"><strong>🌱 Pierwszy krok</strong><p class="sub">Dodaj swoją pierwszą przykładową obserwację.</p></div>')+'<button class="primary full" onclick="go(\'addnote\')">＋ Nowa obserwacja</button>'+aviso()}
else if(view==='addnote'){out=heading(view)+'<form class="card" onsubmit="addNote(event)"><label class="field" for="note-title">Tytuł</label><input required maxlength="90" id="note-title" class="input" placeholder="Co dziś się udało?"><label class="field" for="note-body">Opis obserwacji</label><textarea required maxlength="900" rows="6" id="note-body" class="input" placeholder="Opisz przykładowy postęp..."></textarea><p></p><button class="primary full" type="submit">Zapisz obserwację</button></form>'+aviso()}
else if(view==='passport'){out=heading(view)+'<p class="sub">Najważniejsze informacje o dziecku, podane na przykładowym profilu.</p><div class="profile" style="margin-top:0"><div class="avatar">🐧</div><div><strong>Pingwinek</strong><p>Profil przykładowy</p><span class="tag">Demo</span></div></div>'+section('Karta informacyjna')+card('🩺','Informacje medyczne','Pola demonstracyjne',"go('medical')")+card('📄','Dokumentacja','Orzeczenia, opinie i zalecenia',"go('docs')")+card('👩‍⚕️','Specjaliści','Zespół wsparcia',"go('specialists')")+aviso()}
else if(view==='more'){out=heading(view)+'<p class="sub">Wybierz interesujący obszar wsparcia.</p>'+[['🩺','Paszport medyczny','passport'],['👩‍⚕️','Specjaliści','specialists'],['🏫','Specjaliści w szkole','school'],['💚','Wsparcie dla rodzica','support'],['📖','Poradnik formalności','formalities'],['⏱️','Terminy i formalności','deadlines'],['🤝','Społeczność i wsparcie','community'],['☎️','Ważne kontakty','contacts'],['🔔','Powiadomienia','notifications'],['⚙️','Ustawienia demo','settings']].map(x=>card(x[0],x[1],'Otwórz sekcję',"go('"+x[2]+"')")).join('')+aviso()}
else if(view==='specialists'||view==='school'){out=heading(view)+'<p class="sub">Przykładowe role w zespole wspierającym dziecko.</p>'+[['👩‍⚕️','Logopeda','Terapia mowy i komunikacji'],['🧠','Psycholog','Wsparcie emocjonalne i rozwój'],['🏫','Pedagog specjalny','Wsparcie edukacyjne'],['🏃','Fizjoterapeuta','Rozwój motoryczny']].map(x=>card(x[0],x[1],x[2],"demoOnly()")).join('')+aviso()}
else if(view==='support'||view==='formalities'||view==='community'||view==='deadlines'){out=heading(view)+'<p class="sub">Przydatne tematy i ścieżki wsparcia dla rodziców.</p>'+[['💚','Wsparcie na co dzień','Życzliwe przypomnienia i praktyczne wskazówki'],['📘','Poradnik formalności','Jak przygotować zestaw dokumentów'],['⏰','Ważne terminy','Planowanie wizyt i ważnych dat'],['🤝','Sieć wsparcia','Przykładowe zasoby społeczności']].map(x=>card(x[0],x[1],x[2],"demoOnly()")).join('')+aviso()}
else if(view==='notifications'){out=heading(view)+'<p class="sub">Przypomnienia i ważne sprawy w jednym miejscu.</p>'+card('🔔','Witaj w Demo 3.0','To jest przykładowe powiadomienie',"go('home')")+card('📅','Zaplanuj wizytę','Dodaj demonstracyjne wydarzenie',"go('addevent')")+aviso()}
else if(view==='settings'){out=heading(view)+'<p class="sub">Zarządzanie przykładowymi danymi i prezentacją.</p><div class="card"><strong>Wersja: 3.0</strong><p class="sub">Wszystkie dane formularzy zapisywane są wyłącznie w pamięci lokalnej tego urządzenia.</p><button class="secondary full" onclick="resetDemo()">🗑️ Wyczyść dane demo</button></div>'+aviso()}
else {out=heading(view)+'<p class="sub">Moduł demonstracyjny. Wersja produkcyjna będzie zawierać bezpiecznie przechowywane informacje i dane konta.</p>'+card('🐧','Mój Pingwinek','Więcej funkcji w przygotowaniu',"go('home')")+aviso()}
$('#app').innerHTML=out;$('#bottom').innerHTML=tabs.map(t=>'<button class="'+(view===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[2]+'</b>'+t[1]+'</button>').join('');if(view==='docs')filterDocs()}function filterDocs(){let q=($('#search-doc')?.value||'').toLowerCase();let list=demoDocs.map((d,i)=>({...d,i})).filter(d=>(category==='Wszystkie'||category===d.group)&&d.name.toLowerCase().includes(q));$('#docs-list').innerHTML=list.length?list.map(d=>card(d.icon,d.name,d.group+' · '+d.date,'openDoc('+d.i+')')).join(''):'<div class="empty">Brak dokumentów dla tego filtra.</div>'}render();
