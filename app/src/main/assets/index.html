<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mój Pingwinek — Demo</title><style>body{font:16px system-ui;background:#eaf4ef;margin:0;color:#23483b}.phone{max-width:420px;margin:20px auto;background:white;min-height:85vh;border:9px solid #29443b;border-radius:35px;overflow:hidden}header{padding:25px;background:#d9efe3}h1{margin:0}main{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{background:white;border:1px solid #c9dfd2;border-radius:15px;padding:20px;cursor:pointer;color:#23483b;font:inherit;text-align:left}button:hover{background:#eaf4ef}.back{padding:10px;margin-bottom:12px}footer{font-size:12px;text-align:center;padding:20px;color:#567468}@media(max-width:480px){.phone{margin:0;border:0;border-radius:0;min-height:100vh}}</style><div class="phone"><header><h1>🐧 Mój Pingwinek</h1><p>Twoje miejsce wsparcia · DEMO</p></header><main id="main"></main><footer>Przykładowe dane. Nie wpisuj prawdziwych danych medycznych.</footer></div><script>const sections={'Dokumenty':['📄 Orzeczenie (przykład)','📄 Zalecenia terapeuty (przykład)'],'Kalendarz':['📅 Wizyta u logopedy','📅 Zajęcia terapeutyczne'],'Dziennik obserwacji':['🌱 Nowe słowo','⭐ Udany dzień'],'Paszport medyczny':['🩺 Informacje demonstracyjne'],'Specjaliści':['👩‍⚕️ Logopeda','🧑‍⚕️ Psycholog'],'Wsparcie rodzica':['💚 Porady i materiały'],'Powiadomienia':['🔔 Przykładowe przypomnienie'],'Profil':['👤 Konto demonstracyjne']};function show(name){let el=document.getElementById('main');if(!name){el.innerHTML='<h2>Witaj!</h2><p>Wybierz sekcję, aby przetestować aplikację.</p><div class="grid">'+Object.keys(sections).map(k=>'<button onclick="show('+JSON.stringify(k).replace(/"/g,'&quot;')+')">'+k+'</button>').join('')+'</div>';return}el.innerHTML='<button class="back" onclick="show()">← Wróć</button><h2>'+name+'</h2>'+sections[name].map(v=>'<button style="display:block;width:100%;margin:8px 0" onclick="alert(\'To jest przykładowy element demo.\')">'+v+'</button>').join('')}show()</script></html>
