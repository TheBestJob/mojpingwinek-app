<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075f78"><title>Mój Pingwinek • Demo 2.0</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#142b40;background:#e4eff4}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer} .phone{max-width:430px;min-height:100dvh;margin:auto;background:#f8fbff;position:relative;box-shadow:0 0 35px #153c5324;padding-bottom:90px}header{background:linear-gradient(140deg,#006683,#0783a3);color:#fff;border-radius:0 0 30px 30px;padding:22px 24px 35px}header .top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;opacity:.82;letter-spacing:.04em;text-transform:uppercase}header h1{font-size:27px;margin:8px 0 5px}header p{font-size:13px;margin:0;opacity:.95}.logo{background:#fff4;border-radius:18px;padding:10px;font-size:28px}.body{padding:0 18px 28px} .welcome{margin-top:-18px;background:#fff;border:1px solid #e9f1f5;box-shadow:0 12px 25px #153c5310;border-radius:21px;padding:17px 18px}.welcome b{font-size:16px}.welcome p{font-size:13px;color:#61758a;margin:5px 0 0}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 12px}.sectiontitle h2{font-size:18px;margin:0}.sectiontitle span{font-size:12px;color:#658096}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{min-height:120px;text-align:left;border:1px solid #edf2f7;border-radius:20px;background:#fff;padding:16px;box-shadow:0 4px 14px #284d6410}.tile .emoji{display:block;font-size:25px;margin-bottom:13px}.tile b{display:block;font-size:14px}.tile small{color:#6d8295;font-size:11px;line-height:1.5}.tile.a{background:#e8f6fe}.tile.b{background:#ecf9f0}.tile.c{background:#fff5e9}.tile.d{background:#f3efff}.item{display:flex;gap:13px;align-items:center;width:100%;text-align:left;border:1px solid #e8eff5;background:#fff;border-radius:17px;padding:14px;margin:10px 0}.item .ico{display:grid;place-items:center;background:#e7f5fb;border-radius:13px;width:43px;height:43px;flex-shrink:0;font-size:21px}.item .txt{flex:1;min-width:0}.item b{display:block;font-size:13px}.item small{display:block;margin-top:4px;font-size:12px;color:#708295}.arrow{color:#86a0b0}.pill{display:inline-block;color:#176c57;background:#e5f7eb;border-radius:30px;padding:5px 9px;font-size:11px;margin-top:5px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-top:1px solid #e7eef5;display:flex;justify-content:space-around;padding:10px 6px max(11px,env(safe-area-inset-bottom));z-index:3}nav button{border:0;background:transparent;color:#728699;min-width:56px;font-size:10px;padding:3px}nav button span{display:block;font-size:22px;margin-bottom:3px}nav button.active{color:#006d8d;font-weight:700}.back{border:0;background:transparent;color:#006b87;font-weight:700;padding:18px 0 10px}.page-title{font-size:24px;margin:9px 0}.muted{color:#6d8192;font-size:13px;line-height:1.6}.btn{border:0;border-radius:13px;padding:13px 17px;background:#006c88;color:#fff;font-weight:650}.btn.secondary{background:#e6f4f9;color:#006683}.form{background:#fff;border-radius:18px;padding:17px;border:1px solid #e7eff5}.form label{font-size:12px;color:#687d90;display:block;margin:10px 0 5px}.form input,.form textarea{width:100%;border:1px solid #d6e4eb;border-radius:10px;padding:11px;background:#fafcfe}.form textarea{min-height:95px}.notice{border-radius:14px;padding:14px;background:#fff4e8;color:#81572a;font-size:12px;line-height:1.5;margin-top:20px}.day{display:inline-grid;place-items:center;border:1px solid #dce8ef;border-radius:12px;width:41px;height:52px;margin:3px;color:#42647a;background:#fff;font-size:12px}.day.active{background:#006f8d;color:#fff} .empty{padding:25px;text-align:center;color:#738ba1;font-size:13px} @media(min-width:500px){.phone{min-height:870px;margin:25px auto;border-radius:28px;overflow:hidden}nav{bottom:10px;border-radius:0 0 24px 24px}}</style></head><body><div class="phone"><header><div class="top"><div><div class="eyebrow">Demo 2.0 · Przestrzeń rodzica</div><h1 id="heading">Mój Pingwinek 🐧</h1><p>Razem łatwiej zadbać o każdy dzień</p></div><div class="logo">🐧</div></div></header><div class="body" id="app"></div><nav id="nav"></nav></div><script>
const icons={'home':'⌂','docs':'📁','calendar':'📅','journal':'✍️','more':'☷'};const navItems=[['home','Pulpit'],['docs','Dokumenty'],['calendar','Kalendarz'],['journal','Dziennik'],['more','Więcej']];const sections={passport:'Paszport medyczny',specialists:'Specjaliści',support:'Wsparcie rodzica',school:'Plan szkolny',contacts:'Kontakty',reminders:'Powiadomienia'};let view='home';let items=JSON.parse(localStorage.getItem('pingwinek_demo_notes')||'[]');let events=JSON.parse(localStorage.getItem('pingwinek_demo_events')||'[]');const demoDocs=[['📄','Orzeczenie o niepełnosprawności','Dokument demonstracyjny'],['📋','Zalecenia terapeutyczne','Przykładowa karta zaleceń'],['🩺','Podsumowanie wizyty','Przykładowa dokumentacja']];function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function tile(icon,name,sub,page,color){return '<button class="tile '+color+'" onclick="go(\''+page+'\')"><span class="emoji">'+icon+'</span><b>'+name+'</b><small>'+sub+'</small></button>'}function item(icon,title,sub,page){return '<button class="item" onclick="go(\''+page+'\')"><span class="ico">'+icon+'</span><span class="txt"><b>'+safe(title)+'</b><small>'+safe(sub)+'</small></span><span class="arrow">›</span></button>'}function save(){localStorage.setItem('pingwinek_demo_notes',JSON.stringify(items));localStorage.setItem('pingwinek_demo_events',JSON.stringify(events))}function go(page){view=page;render();window.scrollTo(0,0)}function header(title,sub){return '<button class="back" onclick="go(\'home\')">← Pulpit</button><h2 class="page-title">'+title+'</h2><p class="muted">'+sub+'</p>'}function render(){document.getElementById('heading').textContent=view==='home'?'Mój Pingwinek 🐧':(sections[view]||navItems.find(x=>x[0]===view)?.[1]||'Mój Pingwinek');let h='';if(view==='home'){h='<div class="welcome"><b>👋 Dzień dobry!</b><p>Witaj w demonstracyjnej przestrzeni Mój Pingwinek. Wszystkie dane są przykładowe.</p></div><div class="sectiontitle"><h2>Twoje centrum wsparcia</h2><span>6 obszarów</span></div><div class="tiles">'+tile('📁','Dokumenty','Ważne informacje w jednym miejscu','docs','a')+tile('📅','Kalendarz','Wizyty i zajęcia','calendar','b')+tile('✍️','Dziennik','Małe i wielkie sukcesy','journal','c')+tile('🩺','Paszport medyczny','Przegląd informacji','passport','d')+tile('👩‍⚕️','Specjaliści','Kontakty i konsultacje','specialists','b')+tile('💚','Wsparcie rodzica','Poradniki i wskazówki','support','a')+'</div><div class="sectiontitle"><h2>Najbliższe wydarzenia</h2></div>'+item('📅','Spotkanie z logopedą','Przykładowe wydarzenie','calendar')+item('🔔','Sprawdź powiadomienia','Przypomnienia demonstracyjne','reminders');}
else if(view==='docs'){h=header('Dokumenty','Przykładowy segregator dokumentacji.')+demoDocs.map(x=>item(x[0],x[1],x[2],'docdetail')).join('')+'<div class="notice">🔒 Demo nie przesyła ani nie przechowuje prawdziwych plików. Wersja produkcyjna będzie wymagać bezpiecznej chmury.</div>'}
else if(view==='docdetail'){h=header('Podgląd dokumentu','To demonstracja ekranu szczegółów dokumentu.')+'<div class="form"><h3>📄 Dokument przykładowy</h3><p class="muted">Status: dostępny tylko w wersji demonstracyjnej.</p><span class="pill">Przykład</span></div>'}
else if(view==='calendar'){h=header('Kalendarz','Zaplanuj wizyty i ważne wydarzenia.')+'<div class="sectiontitle"><h2>Październik 2026</h2></div>'+[19,20,21,22,23,24,25].map(d=>'<div class="day '+(d===24?'active':'')+'"><small>'+['Pn','Wt','Śr','Cz','Pt','Sb','Nd'][(d-19)%7]+'</small><b>'+d+'</b></div>').join('')+'<div class="sectiontitle"><h2>Wydarzenia</h2></div>'+item('🗓️','Konsultacja terapeutyczna','Przykładowy wpis','calendar')+events.map((x,i)=>item('🗓️',x.name,x.date,'calendar')).join('')+'<button class="btn" onclick="go(\'addevent\')">+ Dodaj wydarzenie</button>'}
else if(view==='addevent'){h=header('Nowe wydarzenie','Dodaj testowe wydarzenie na tym urządzeniu.')+'<form class="form" onsubmit="addEvent(event)"><label>Nazwa</label><input id="eventname" maxlength="80" required placeholder="np. Zajęcia logopedyczne"><label>Data</label><input id="eventdate" type="date" required><p></p><button class="btn" type="submit">Zapisz</button></form>'}
else if(view==='journal'){h=header('Dziennik obserwacji','Zapisuj sukcesy i codzienne spostrzeżenia.')+'<button class="btn" onclick="go(\'addnote\')">+ Nowa obserwacja</button><div class="sectiontitle"><h2>Ostatnie wpisy</h2></div>'+item('🌱','Pierwsza samodzielna próba','Demonstracyjna obserwacja','journal')+items.map(x=>item('✍️',x.title,x.text,'journal')).join('')}
else if(view==='addnote'){h=header('Nowa obserwacja','Przykładowe notatki zostają lokalnie w przeglądarce.')+'<form class="form" onsubmit="addNote(event)"><label>Tytuł</label><input id="notetitle" maxlength="80" required placeholder="Co się dziś udało?"><label>Obserwacja</label><textarea id="notebody" maxlength="500" required placeholder="Opisz swój dzień..."></textarea><p></p><button class="btn" type="submit">Zapisz wpis</button></form>'}
else if(view==='more'){h=header('Więcej','Wszystkie narzędzia w jednym miejscu.')+Object.entries(sections).map(([k,v])=>item('🐧',v,'Otwórz sekcję',k)).join('')}
else if(view==='passport'){h=header('Paszport medyczny','Podsumowanie ważnych informacji w jednym miejscu.')+item('🩺','Profil dziecka','Dane przykładowe','passport')+item('📋','Zalecenia','Informacje demonstracyjne','docs')+item('📄','Dokumentacja','Orzeczenia i zaświadczenia','docs')}
else if(view==='specialists'){h=header('Specjaliści','Osoby, które wspierają rozwój dziecka.')+item('👩‍⚕️','Logopeda','Profil demonstracyjny','specialists')+item('👨‍⚕️','Psycholog','Profil demonstracyjny','specialists')+item('🏫','Specjaliści w szkole','Przykładowe kontakty','school')}
else if(view==='support'){h=header('Wsparcie rodzica','Przydatne obszary wiedzy i wsparcia.')+item('💚','Małe kroki, wielkie sukcesy','Motywacja','support')+item('📖','Poradnik formalności','Ważne informacje','support')+item('🤝','Społeczność i pomoc','Sekcja demonstracyjna','support')}
else if(view==='school'){h=header('Plan szkolny','Przegląd przykładowych aktywności.')+item('🏫','Zajęcia wspierające','Plan demonstracyjny','calendar')}
else if(view==='contacts'){h=header('Kontakty','Przykładowy spis kontaktów.')+item('📞','Specjalista','Dane demonstracyjne','specialists')}
else if(view==='reminders'){h=header('Powiadomienia','Twoje przypomnienia.')+item('🔔','Nadchodząca wizyta','Przykładowe powiadomienie','calendar')}
h+='<div class="notice">🐧 Mój Pingwinek Demo 2.0 — pokaz funkcji, bez logowania i bez połączenia z serwerem. Nie wprowadzaj prawdziwych danych zdrowotnych.</div>';document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=navItems.map(([key,title])=>'<button class="'+(view===key?'active':'')+'" onclick="go(\''+key+'\')"><span>'+icons[key]+'</span>'+title+'</button>').join('')}
function addNote(e){e.preventDefault();items.unshift({title:document.getElementById('notetitle').value,text:document.getElementById('notebody').value});save();go('journal')}function addEvent(e){e.preventDefault();events.unshift({name:document.getElementById('eventname').value,date:document.getElementById('eventdate').value});save();go('calendar')}render();
</script></body></html>
